services:
  # Dev-only bot host. It is intentionally a separate service from relay:
  # bots own durable client profiles and never become rendezvous storage.
  soak-bot-host:
    image: rust:1.97-bookworm
    working_dir: /src
    volumes:
      - ../..:/src
      - ../../.torca/soak/bots:/var/lib/torca-soak/bots
      - ../../target:/src/target
    environment:
      TORCA_RELAY_ENDPOINT: ${TORCA_RELAY_ENDPOINT:?set TORCA_RELAY_ENDPOINT to the current relay onion endpoint}
      TORCA_SOAK_BOT_TOKEN: ${TORCA_SOAK_BOT_TOKEN:?set a dev-only bot host token}
    command: >-
      sh -lc 'cargo build -p torca-lab-peer -p torca-soak-bot-host --locked
      && target/debug/torca-soak-bot-host
      --peer-executable target/debug/torca-lab-peer
      --root /var/lib/torca-soak/bots
      --token "$${TORCA_SOAK_BOT_TOKEN}"
      --listen 0.0.0.0:47890'
    ports:
      - "127.0.0.1:47890:47890"
    networks:
      - torca

networks:
  torca:
    external: true
    name: torca_torca
