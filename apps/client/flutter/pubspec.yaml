name: torca_app
description: Shared Flutter client composition for Torca.
publish_to: "none"
version: 0.2.0-alpha.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.2.1
  file_picker: ^11.0.2
  local_notifier: ^0.1.6
  mobile_scanner: ^7.4.0
  open_filex: ^4.7.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  torca_ui:
    path: ../../../packages/torca_ui
  torca_attachment_processing:
    path: ../../../packages/torca_attachment_processing

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
