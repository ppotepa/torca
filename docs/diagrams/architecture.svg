<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Torca current architecture</title>
  <desc id="desc">One Flutter client crosses a generated native platform boundary into the layered Rust application. Application ports are provider-neutral. SQLCipher, crypto and files are infrastructure, Iroh is the sole production communication provider, and Memory is test-only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2}.soft{fill:#eef2ff;stroke:#475569;stroke-width:2}.core{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.infra{fill:#fefce8;stroke:#a16207;stroke-width:2}.provider{fill:#ecfeff;stroke:#0f766e;stroke-width:2}.test{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}.title{font:700 28px system-ui,sans-serif;fill:#0f172a}.h{font:700 17px system-ui,sans-serif;fill:#0f172a}.t{font:14px system-ui,sans-serif;fill:#334155}.small{font:12px system-ui,sans-serif;fill:#475569}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="820" rx="24"/>
  <text class="title" x="52" y="58">Torca — current system ownership</text>

  <rect class="soft" x="70" y="95" width="1060" height="88" rx="16"/>
  <text class="h" x="100" y="129">Flutter presentation — Windows + Android</text>
  <text class="t" x="100" y="155">Responsive UI • navigation • transient interaction • presentation preferences • typed user intent</text>

  <rect class="box" x="310" y="215" width="580" height="90" rx="14"/>
  <text class="h" x="340" y="250">Platform/native boundary</text>
  <text class="t" x="340" y="276">EngineGateway • generated contract • torca-native ABI • Windows/Android host services</text>

  <rect class="soft" x="245" y="345" width="710" height="132" rx="18"/>
  <text class="h" x="280" y="380">Application + process-owned runtime</text>
  <text class="t" x="280" y="408">Use cases • commands/queries • durable delivery • pairing • connectivity • diagnostics</text>
  <text class="t" x="280" y="434">Provider-neutral ports • runtime/power policy • presentation-safe projections</text>
  <text class="small" x="280" y="458">Event/deadline driven; Flutter polling is not a correctness scheduler</text>

  <rect class="core" x="70" y="530" width="315" height="126" rx="16"/>
  <text class="h" x="100" y="564">Core contracts</text>
  <text class="t" x="100" y="592">foundation • domains • protocol</text>
  <text class="t" x="100" y="618">product invariants + bounded wire contracts</text>
  <text class="small" x="100" y="640">independent of concrete providers/OS/UI</text>

  <rect class="infra" x="445" y="530" width="300" height="126" rx="16"/>
  <text class="h" x="475" y="564">Local infrastructure</text>
  <text class="t" x="475" y="592">SQLCipher repositories • crypto</text>
  <text class="t" x="475" y="618">protected secrets • files • logging</text>
  <text class="small" x="475" y="640">implements inward-facing ports</text>

  <rect class="provider" x="805" y="530" width="325" height="126" rx="16"/>
  <text class="h" x="835" y="564">Iroh provider — production</text>
  <text class="t" x="835" y="592">endpoint identity • opaque routes • dial/accept</text>
  <text class="t" x="835" y="618">direct / Iroh relay reachability</text>
  <text class="small" x="835" y="640">transport reachability; not Torca peer identity</text>

  <rect class="test" x="805" y="695" width="325" height="70" rx="14"/>
  <text class="h" x="835" y="724">Memory provider — tests only</text>
  <text class="small" x="835" y="748">deterministic conformance/integration fixture</text>

  <path class="line" d="M600 183 V215"/>
  <path class="line" d="M600 305 V345"/>
  <path class="line" d="M420 477 C340 505 280 505 230 530"/>
  <path class="line" d="M600 477 V530"/>
  <path class="line" d="M780 477 C860 502 920 505 965 530"/>
  <path class="dash" d="M965 656 V695"/>

  <text class="small" x="70" y="790">Tor and unfinished WebRTC are retired from the active product graph. A future provider must stay behind the neutral boundary and pass conformance + release evidence.</text>
</svg>