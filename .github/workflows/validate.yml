name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.97.1
      - name: Source policy
        shell: pwsh
        run: ./scripts/modules/Torca.SourcePolicy.ps1 -RepoRoot .
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust check
        run: cargo check --workspace --all-targets --locked
      - name: Production provider check
        run: cargo check --locked -p torca-native
      - name: Provider dependency graph policy
        shell: pwsh
        run: ./scripts/Verify-TorcaProviderBoundary.ps1 -RepoRoot .
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness -D clippy::suspicious -D clippy::perf
      - name: Rust tests
        run: cargo test --workspace --all-targets --locked
      - name: Provider conformance tests
        run: cargo test --locked -p torca-provider-conformance
      - name: Iroh provider tests
        run: cargo test --locked -p torca-transport-iroh
      - name: Full Rust warnings gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Avatar asset validation
        shell: pwsh
        run: ./scripts/Validate-TorcaAvatarAssets.ps1
      - name: Battery idle scheduler gate
        shell: bash
        run: |
          cargo test --locked -p torca-runtime idle_scheduler_has_no_application_deadline
          cargo test --locked -p torca-runtime-policy idle_governor_has_no_scheduled_work_or_active_leases
      - name: Rust deploy planner smoke test
        run: cargo run --locked -p torca-deploy -- full-redeploy --target all --configuration debug --dry-run

  flutter:
    name: Flutter and bridge contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: apps/client/flutter
        run: flutter pub get
      - name: Dart format
        working-directory: apps/client/flutter
        run: dart format --output=none --set-exit-if-changed lib test ../../../crates/platform/torca-contract/schema/torca_contract.dart
      - name: Generated contract drift
        run: cargo run -p torca-contract-gen -- --check apps/client/flutter/lib/generated/torca_contract.dart
      - name: Flutter analysis
        working-directory: apps/client/flutter
        run: flutter analyze
      - name: Flutter tests
        working-directory: apps/client/flutter
        run: flutter test

  windows:
    name: Windows client build
    needs: [core, flutter]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.97.1
      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true
      - name: Build Windows client
        shell: pwsh
        run: cargo run --locked -p torca-deploy -- build --target windows --configuration debug

  android:
    name: Android client build
    needs: [core, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.97.1
      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true
      - name: Build Android client
        shell: pwsh
        run: cargo run --locked -p torca-deploy -- build --target android --configuration debug
