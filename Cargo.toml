[workspace]
members = [
    "crates/foundation/torca-foundation",
    "crates/protocol/torca-wire",
    "crates/protocol/torca-pairing-protocol",
    "crates/protocol/torca-relay-protocol",
    "crates/protocol/torca-peer-protocol",
    "crates/protocol/torca-radio-protocol",
    "crates/domains/torca-identity",
    "crates/domains/torca-contacts",
    "crates/domains/torca-conversations",
    "crates/domains/torca-pairing",
    "crates/domains/torca-messaging",
    "crates/domains/torca-receipts",
    "crates/domains/torca-attachments",
    "crates/domains/torca-presence",
    "crates/domains/torca-notifications",
    "crates/domains/torca-radio",
    "crates/application/torca-client-engine",
    "crates/application/torca-client-application",
    "crates/application/torca-delivery",
    "crates/application/torca-pairing-coordinator",
    "crates/application/torca-diagnostics",
    "crates/application/torca-probing",
    "crates/application/torca-connectivity",
    "crates/application/torca-runtime-policy",
    "crates/application/torca-bootstrap",
    "crates/application/torca-runtime",
    "crates/application/torca-communication-driver",
    "crates/application/torca-control-delivery",
    "crates/application/torca-radio-coordinator",
    "crates/infrastructure/torca-storage-sqlite",
    "crates/infrastructure/torca-crypto",
    "crates/infrastructure/torca-rendezvous-client",
    "crates/infrastructure/torca-peer",
    "crates/infrastructure/torca-peer-link",
    "crates/infrastructure/torca-peer-shared",
    "crates/infrastructure/torca-tor",
    "crates/infrastructure/torca-file-storage",
    "crates/infrastructure/torca-communication-adapters",
    "crates/infrastructure/torca-attachment-sqlite",
    "crates/infrastructure/torca-attachment-transfer",
    "crates/infrastructure/torca-pairing-driver",
    "crates/infrastructure/torca-logging",
    "crates/infrastructure/torca-radio-adapters",
    "services/relay",
    "crates/platform/torca-contract",
    "crates/platform/torca-native",
    "crates/platform/torca-platform",
    "crates/platform/torca-platform-android",
    "crates/platform/torca-platform-windows",
    "tools/torca-contract-gen",
    "tools/torca-deploy",
    "tests/torca-integration",
]
resolver = "3"

# Release is used frequently during device iteration because it exercises the
# same packaging path as production. Keeping incremental metadata makes a
# second release build substantially cheaper; CI can still start from a clean
# target directory when a fully cold build is required.
[profile.release]
incremental = true

# Arti 0.45 currently pulls saturating-time 0.4.0.  The published crate can
# spin forever on Windows where SystemTime rounds sub-100ns durations to zero.
# Keep the fix reproducible until an upstream release contains the guard.
[patch.crates-io]
saturating-time = { path = "third_party/saturating-time" }

[workspace.package]
version = "0.2.0-alpha.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ppotepa/torca-test"
authors = ["Torca contributors"]

[workspace.lints.rust]
missing_docs = "allow"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"
collapsible_if = "allow"
single_match_else = "allow"
duration_suboptimal_units = "allow"
map_unwrap_or = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
case_sensitive_file_extension_comparisons = "allow"
ignored_unit_patterns = "allow"
unreadable_literal = "allow"
needless_borrows_for_generic_args = "allow"
unnecessary_wraps = "allow"
unnecessary_lazy_evaluations = "allow"
uninlined_format_args = "allow"
manual_let_else = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
match_same_arms = "allow"
format_collect = "allow"
ref_option = "allow"
redundant_closure_for_method_calls = "allow"
unsafe_removed_from_name = "allow"
missing_safety_doc = "allow"
