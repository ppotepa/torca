[workspace]
members = [
    "crates/foundation/torca-foundation",
    "crates/protocol/torca-wire",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ppotepa/torca-test"
authors = ["Torca contributors"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
