[package]
name = "torca-lab-peer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["provider-iroh", "radio-audio"]
provider-iroh = ["torca-native/provider-iroh"]
radio-audio = ["torca-native/radio-audio"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
torca-native = { path = "../../crates/platform/torca-native", default-features = false }

[lints]
workspace = true
