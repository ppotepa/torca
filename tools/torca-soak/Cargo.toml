[package]
name = "torca-soak"
default-run = "torca-soak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "torca-soak"
path = "src/main.rs"

# Compatibility name retained for existing battery-soak instructions.  Both
# names intentionally execute the same cockpit; the canonical entry point is
# still `torca-soak` (or `scripts/soak.ps1`).
[[bin]]
name = "torca-battery-soak-tui"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
torca-deploy = { path = "../torca-deploy" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
