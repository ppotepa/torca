[package]
name = "torca-transport-iroh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[features]
default = []
audio = ["torca-radio-adapters/audio"]

[dependencies]
iroh = { version = "1.0.3", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "sync", "time"] }
url = "2"
serde_json = "1"
torca-peer-protocol = { path = "../../protocol/torca-peer-protocol" }
torca-contacts = { path = "../../domains/torca-contacts" }
torca-transport-api = { path = "../../application/torca-transport-api" }
torca-runtime = { path = "../../application/torca-runtime" }
torca-foundation = { path = "../../foundation/torca-foundation" }
torca-crypto = { path = "../torca-crypto" }
torca-identity = { path = "../../domains/torca-identity" }
torca-pairing-protocol = { path = "../../protocol/torca-pairing-protocol" }
torca-pairing-service-client = { path = "../torca-pairing-service-client" }
torca-pairing-service-protocol = { path = "../../protocol/torca-pairing-service-protocol" }
torca-pairing = { path = "../../domains/torca-pairing" }
torca-pairing-coordinator = { path = "../../application/torca-pairing-coordinator" }
torca-radio-adapters = { path = "../torca-radio-adapters", default-features = false }
torca-radio-coordinator = { path = "../../application/torca-radio-coordinator" }

[dev-dependencies]
torca-peer-link = { path = "../torca-peer-link" }

[lints]
workspace = true
