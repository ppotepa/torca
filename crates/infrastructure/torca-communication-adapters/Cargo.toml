[package]
name = "torca-communication-adapters"
version.workspace = true
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
torca-runtime-policy = { path = "../../application/torca-runtime-policy" }
torca-connectivity = { path = "../../application/torca-connectivity" }
sha2 = "0.10"
rand_core = { version = "0.6.4", features = ["getrandom"] }
torca-attachments = { path = "../../domains/torca-attachments" }
torca-attachment-sqlite = { path = "../torca-attachment-sqlite" }
torca-attachment-transfer = { path = "../torca-attachment-transfer" }
torca-attachment-protocol = { path = "../../protocol/torca-attachment-protocol" }
torca-client-engine = { path = "../../application/torca-client-engine" }
torca-communication-driver = { path = "../../application/torca-communication-driver" }
torca-contacts = { path = "../../domains/torca-contacts" }
torca-control-delivery = { path = "../../application/torca-control-delivery" }
torca-conversations = { path = "../../domains/torca-conversations" }
torca-crypto = { path = "../torca-crypto" }
torca-delivery = { path = "../../application/torca-delivery" }
torca-file-storage = { path = "../torca-file-storage" }
torca-foundation = { path = "../../foundation/torca-foundation" }
torca-identity = { path = "../../domains/torca-identity" }
torca-messaging = { path = "../../domains/torca-messaging" }
torca-peer-link = { path = "../torca-peer-link" }
torca-tor = { package = "torca-tor", path = "../torca-tor" }
torca-peer-protocol = { path = "../../protocol/torca-peer-protocol" }
torca-peer-shared = { path = "../torca-peer-shared" }
torca-receipts = { path = "../../domains/torca-receipts" }
torca-radio = { path = "../../domains/torca-radio" }
torca-radio-adapters = { path = "../torca-radio-adapters", default-features = false }
torca-radio-coordinator = { path = "../../application/torca-radio-coordinator" }
torca-radio-protocol = { path = "../../protocol/torca-radio-protocol" }
torca-runtime = { path = "../../application/torca-runtime" }
torca-storage-sqlite = { path = "../torca-storage-sqlite" }

[lints]
workspace = true
