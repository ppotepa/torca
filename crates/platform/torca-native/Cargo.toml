[package]
name = "torca-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "torca_bridge"
path = "src/runtime.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
torca-bridge = { path = "../torca-bridge" }
torca-client-engine = { path = "../../application/torca-client-engine" }
torca-communication-adapters = { path = "../../infrastructure/torca-communication-adapters" }
torca-crypto = { path = "../../infrastructure/torca-crypto" }
torca-foundation = { path = "../../foundation/torca-foundation" }
torca-identity = { path = "../../domains/torca-identity" }
torca-pairing = { path = "../../domains/torca-pairing" }
torca-pairing-coordinator = { path = "../../application/torca-pairing-coordinator" }
torca-pairing-driver = { path = "../../infrastructure/torca-pairing-driver" }
torca-rendezvous-client = { path = "../../infrastructure/torca-rendezvous-client" }
torca-runtime-host = { path = "../../application/torca-runtime-host" }
torca-storage-sqlite = { path = "../../infrastructure/torca-storage-sqlite" }
torca-tor-driver = { path = "../../infrastructure/torca-tor-driver" }
torca-transport-tor = { path = "../../infrastructure/torca-transport-tor" }

[target.'cfg(windows)'.dependencies]
torca-platform-windows = { path = "../torca-platform-windows" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
