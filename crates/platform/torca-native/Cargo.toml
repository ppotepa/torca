[package]
name = "torca-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "torca_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
torca-bridge = { path = "../torca-bridge" }
torca-client-engine = { path = "../../application/torca-client-engine" }

[target.'cfg(windows)'.dependencies]
torca-crypto = { path = "../../infrastructure/torca-crypto" }
torca-identity = { path = "../../domains/torca-identity" }
torca-pairing = { path = "../../domains/torca-pairing" }
torca-platform-windows = { path = "../torca-platform-windows" }
torca-storage-sqlite = { path = "../../infrastructure/torca-storage-sqlite" }

# This crate is the narrowly reviewed unsafe FFI boundary. It intentionally
# does not inherit the workspace-wide `unsafe_code = forbid` lint.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
