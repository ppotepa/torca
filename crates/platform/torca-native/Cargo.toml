[package]
name = "torca-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[features]
default = ["provider-tor", "radio-audio"]
## Exactly one provider feature must be enabled for a native artifact.  The
## default keeps ordinary local builds backwards compatible; deployment uses
## `--no-default-features` and selects the requested provider explicitly.
provider-tor = [
    "dep:torca-rendezvous-client",
    "dep:torca-rendezvous-tor",
    "dep:torca-relay-protocol",
    "dep:torca-radio-tor",
    "dep:torca-transport-tor",
    "dep:torca-tor",
    "torca-radio-tor/audio",
]
provider-iroh = [
    "dep:torca-transport-iroh",
    "torca-transport-iroh/audio",
]
provider-webrtc = [
    "dep:torca-rendezvous-client",
    "dep:torca-relay-protocol",
    "dep:torca-transport-webrtc",
]
radio-audio = [
    "torca-radio-adapters/audio",
]

[lib]
name = "torca_native"
path = "src/runtime.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
torca-client-application = { path = "../../application/torca-client-application" }
torca-contract = { path = "../torca-contract" }
torca-client-engine = { path = "../../application/torca-client-engine" }
torca-attachments = { path = "../../domains/torca-attachments" }
torca-communication-adapters = { path = "../../infrastructure/torca-communication-adapters" }
torca-contacts = { path = "../../domains/torca-contacts" }
torca-conversations = { path = "../../domains/torca-conversations" }
torca-crypto = { path = "../../infrastructure/torca-crypto" }
torca-foundation = { path = "../../foundation/torca-foundation" }
torca-provider-api = { path = "../../application/torca-provider-api" }
torca-identity = { path = "../../domains/torca-identity" }
torca-pairing = { path = "../../domains/torca-pairing" }
torca-pairing-coordinator = { path = "../../application/torca-pairing-coordinator" }
torca-pairing-driver = { path = "../../infrastructure/torca-pairing-driver" }
torca-pairing-protocol = { path = "../../protocol/torca-pairing-protocol" }
torca-platform = { path = "../torca-platform" }
torca-peer-link = { path = "../../infrastructure/torca-peer-link" }
torca-runtime-policy = { path = "../../application/torca-runtime-policy" }
torca-messaging = { path = "../../domains/torca-messaging" }
torca-rendezvous-client = { path = "../../infrastructure/torca-rendezvous-client", optional = true }
torca-rendezvous-tor = { path = "../../infrastructure/torca-rendezvous-tor", optional = true }
torca-relay-protocol = { path = "../../protocol/torca-relay-protocol", optional = true }
torca-runtime = { path = "../../application/torca-runtime" }
torca-transport-api = { path = "../../application/torca-transport-api" }
torca-transport-tor = { path = "../../infrastructure/torca-transport-tor", optional = true }
torca-transport-iroh = { path = "../../infrastructure/torca-transport-iroh", optional = true }
torca-transport-webrtc = { path = "../../infrastructure/torca-transport-webrtc", optional = true }
torca-radio-coordinator = { path = "../../application/torca-radio-coordinator" }
torca-radio-adapters = { path = "../../infrastructure/torca-radio-adapters", default-features = false }
torca-radio-tor = { path = "../../infrastructure/torca-radio-tor", optional = true }
torca-connectivity = { path = "../../application/torca-connectivity" }
torca-storage-sqlite = { path = "../../infrastructure/torca-storage-sqlite" }
torca-tor = { package = "torca-tor", path = "../../infrastructure/torca-tor", optional = true }
torca-notifications = { path = "../../domains/torca-notifications" }
torca-logging = { path = "../../infrastructure/torca-logging" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
torca-platform-windows = { path = "../torca-platform-windows" }

[target.'cfg(target_os = "android")'.dependencies]
torca-platform-android = { path = "../torca-platform-android" }
ndk-context = "0.1.1"

jni = "0.21.1"

[lints.rust]
missing_docs = "allow"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
module_name_repetitions = "allow"
must_use_candidate = "allow"
